# Change the prefix key
unbind C-b
set -g prefix C-\\

# Preserve modified keys for terminal TUIs such as Codex.
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'

# Let programs send DCS escape sequences through tmux to the underlying
# terminal. Required for the Kitty graphics protocol (used by Snacks.image
# in nvim) to render images, mermaid diagrams, and LaTeX math.
set -g allow-passthrough on

# Index from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Keep more history in the scrollback buffer
set -g history-limit 10000

# Don't detach until the last session is killed
set -g detach-on-destroy no-detached

# Don't kill panes if they error
set -g remain-on-exit off  # on|off|failed

# Key Bindings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind C-\\ command-prompt
bind -n C-Enter choose-tree -sZ -O time

bind -T root C-b if-shell -F '#{m:ShellFish*,#{client_termtype}}' \
  'switch-client -T prefix' \
  'send-keys C-b'

# floating terminal
bind t display-popup -w 70% -h 70% -b rounded -T " #{session_name} " -d '#{pane_current_path}'

# sessionizer
bind -n C-f display-popup -w 70% -h 70% -E -b rounded -T " taw "  -d '#{pane_current_path}' "~/.zfuns/taw -ts"

# Fast-switch sessions
bind -n C-M-up switch-client -p
bind -n C-M-down switch-client -n
bind -n C-S-` switch-client -l # toggle sessions

bind -n C-M-n {
  command-prompt -bF -p 'name:,start-dir:' -I 'home,~' -T 'target' \
  "new -A -s %1 -c %2 -f no-detach-on-destroy"
}

# Show every managed Codex and Claude window in one Ghostty split dashboard.
bind -n C-M-g run-shell -b '"$HOME/.zfuns/taw-agent-dashboard" toggle'

# Fast-switch windows
bind -n C-M-left prev
bind -n C-M-right next
bind -n C-M-h prev
bind -n C-M-o next
bind -n C-M-` last # toggle

bind -n C-M-j select-window -t 1
bind -n C-M-k select-window -t 2
bind -n C-M-l select-window -t 3
bind -n "C-M-;" select-window -t 4
bind -n "C-M-:" select-window -t 4

# Move windows
bind -n C-S-M-left swap-window -d -t -
bind -n C-S-M-right swap-window -d -t +
bind S swap-window -d -t !

bind -n C-q {
  if-shell -F '#{==:#{@taw_agent_link_session},1}' {
    command-prompt -1 -p 'Unlink #W from agents; it will remain in its source session. [y/N]' {
      if-shell -F '#{m/r:^[Yy],%1}' {
        run-shell -b '"$HOME/.zfuns/taw-agent-status" unlink #{window_id}'
      }
    }
  } {
    if-shell -F '#{==:#{@taw_agent_dashboard_session},1}' {
      command-prompt -1 -p 'Close this dashboard view; its source stays alive. [y/N]' {
        if-shell -F '#{m/r:^[Yy],%1}' {
          run-shell -b '"$HOME/.zfuns/taw-agent-dashboard" unlink #{session_id} #{window_id}'
        }
      }
    } {
      kill-window
    }
  }
}

bind '&' {
  if-shell -F '#{==:#{@taw_agent_link_session},1}' {
    command-prompt -1 -p 'Unlink #W from agents; it will remain in its source session. [y/N]' {
      if-shell -F '#{m/r:^[Yy],%1}' {
        run-shell -b '"$HOME/.zfuns/taw-agent-status" unlink #{window_id}'
      }
    }
  } {
    if-shell -F '#{==:#{@taw_agent_dashboard_session},1}' {
      command-prompt -1 -p 'Close this dashboard view; its source stays alive. [y/N]' {
        if-shell -F '#{m/r:^[Yy],%1}' {
          run-shell -b '"$HOME/.zfuns/taw-agent-dashboard" unlink #{session_id} #{window_id}'
        }
      }
    } {
      confirm-before -p 'kill-window #W? (y/n)' kill-window
    }
  }
}

# fast-switch panes
bind -n C-h selectp -Zt -
bind -n C-j selectp -Zt 1
bind -n C-k selectp -Zt 2
bind -n C-l selectp -Zt 3
bind -n "C-;" selectp -Zt 4
bind -n "C-:" selectp -Zt 4

bind -n C-left selectp -ZL
bind -n C-right selectp -ZR
bind -n C-up selectp -ZU
bind -n C-down selectp -ZD

bind -n C-S-left swapp -ZU
bind -n C-S-right swapp -ZD

# fast-kill pane
bind x kill-pane

# split panes nicer
bind "'" split-window -c "#{pane_current_path}"
bind '"' split-window -b -c "#{pane_current_path}"
bind '-' split-window -f -c "#{pane_current_path}"
bind '_' split-window -bf -c "#{pane_current_path}"
bind ';' split-window -h -c "#{pane_current_path}"
bind ':' {
  if-shell -F '#{m:ShellFish*,#{client_termtype}}' \
  'command' \
  'split-window -hb -c "#{pane_current_path}"'
}
bind '|' split-window -hbf -c "#{pane_current_path}"
bind \\ split-window -hf -c "#{pane_current_path}"

# Agents
bind C-x split-window -h -c "#{pane_current_path}" codex
bind C-c split-window -h -c "#{pane_current_path}" claude
bind C-g split-window -h -c "#{pane_current_path}" gemini

# Agent alerts
bind A {
  setw monitor-bell on ;
  setw monitor-silence 20 ;
  display-message "agent alerts on for this window"
}
bind a {
  setw monitor-bell off ;
  setw monitor-silence 0 ;
  display-message "agent alerts off for this window"
}

# A focused prompt is acknowledged because the CLI cannot observe the user's answer directly.
set-hook -g after-select-pane[80] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status acknowledge #{pane_id}"'
set-hook -g after-select-window[80] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status acknowledge #{pane_id}"'
set-hook -g client-session-changed[80] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status acknowledge #{pane_id}"'
set-hook -g session-window-changed[80] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status acknowledge #{pane_id}"'
set-hook -g client-attached[80] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status acknowledge #{pane_id}"'
set-hook -g client-focus-in[80] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status acknowledge #{pane_id}"'

# Reconcile only when pane membership can change; lifecycle state updates do not need it.
set-hook -g after-kill-pane[70] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status sync"'
# set-hook -g pane-moved[70] \
#   'run-shell -b "$HOME/.zfuns/taw-agent-status sync"'
set-hook -g after-new-window[70] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status sync"'
set-hook -g pane-exited[70] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status sync"'
set-hook -g session-closed[70] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status sync"'
set-hook -g session-renamed[70] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status sync"'
set-hook -g window-linked[70] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status sync"'
set-hook -g window-unlinked[70] \
  'run-shell -b "$HOME/.zfuns/taw-agent-status sync"'

# Pick up agents that published metadata before this configuration was reloaded.
run-shell -b '"$HOME/.zfuns/taw-agent-status" sync'

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# When alerts happen, only alert for non-current windows.
set -g activity-action other
set -g silence-action other
set -g bell-action other

# "both" = tmux message + terminal bell.
# Use "on" if you only want tmux status messages.
# Use "off" if you want the raw bell passed to the terminal without tmux message.
set -g visual-activity both
set -g visual-silence both
set -g visual-bell both

# Make alerting windows visually obvious in the status line.
set -g window-status-activity-style reverse
set -g window-status-bell-style reverse

# clock mode
set -g clock-mode-colour orange

# copy mode
set -g mode-style 'fg=black bg=orange bold'

# panes
# set -g pane-border-style 'fg=cyan'
set -g pane-border-style 'fg=blue'
set -g pane-active-border-style 'fg=black bg=blue bold'
set -g pane-border-indicators both
set -g pane-border-lines spaces

# set terminal emulator title
set -g set-titles on
set -g @title_pane_fallback \
  '#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},#{pane_title},#{pane_current_command}}'
set -g @title_pane \
  '#{?pane_start_command,#{pane_start_command},#{E:@title_pane_fallback}}'
set -g @title_path \
  "#(~/.config/tmux/wspath '#{pane_current_path}')"
set -g @title_branch \
  '#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null)'
set -g @title_branch_suffix \
  '#{?#{!=:#{E:@title_branch},}, @ #{E:@title_branch},}'
set -g set-titles-string \
  '#S:#W.#P · #{E:@title_pane} · [#{E:@title_path}#{E:@title_branch_suffix}]'

set -g allow-rename off
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}'
set -g allow-set-title on

# statusbar
set -g status 2
set -g status-position bottom
set -g status-style 'fg=orange bg=#202030'
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 100

set -g window-status-style 'fg=orange bg=black'
set -g window-status-current-style 'fg=black bg=orange'
set -g window-status-bell-style 'fg=black bg=orange bold'

set -g pane-status-style 'fg=blue bg=black align=left'
set -g pane-status-current-style 'fg=black bg=blue align=left'

set -g @window_status_index \
  "#{?#{<:#I,5},#(~/.config/tmux/ikey '#I'),#I}"
set -g @window_status_agent \
  '#{?#{E:@taw_window_agent_icon},#{E:@taw_window_agent_icon} ,}'
set -g @window_status_flags \
  '#{?#F,#F, }'
set -g window-status-format \
  ' #[bold]#{E:@window_status_index} #[nobold fg=white]#{E:@window_status_agent}#W #[fg=yellow bold]#{E:@window_status_flags} '
set -g window-status-current-format ' ^ #{?#{E:@taw_window_agent_icon},#{E:@taw_window_agent_icon} ,}#W #{?:#F,#F, } '

set -g status-left ''
set -g @status_session \
  '#[fg=red]#S#[fg=default]:#[fg=white]#I#[fg=default].#[fg=blue]#P#[fg=default] (#[fg=red]#{session_id}#[fg=default]:#[fg=white]#{window_id}#[fg=default].#[fg=blue]#{pane_id}#[fg=default]) | -c #(~/.config/tmux/wspath "#{session_path}") '
set -g @status_session_short \
  '#{=/#{e|-:#{e|/:#{window_width},2},16}/…:#{E:@status_session}}'
set -g @status_prefix_indicator \
  '#[fg=black bg=orange bold] (#{prefix})->... #[default] '
set -g @status_right \
  '#{?client_prefix,#{E:@status_prefix_indicator}#{E:@status_session_short},#{E:@status_session}}'
set -g status-right \
  ' #{E:@status_right} '

set -g @pane_status_index \
  '#{?#{<:#{pane_index},5},#(~/.config/tmux/ikey #{pane_index}),#{pane_index}}'
set -g @pane_status_agent \
  '#{?#{E:@taw_pane_agent_icon},#{E:@taw_pane_agent_icon} ,}'
set -g @pane_status_path \
  '#(~/.config/tmux/wspath "#{pane_current_path}")'
set -g @pane_status_branch \
  '#{?#{!=:#{E:@title_branch},},#[fg=blue bold]on  #{E:@title_branch},}'
set -g @pane_status \
  '#[#{E:pane-status-style}] #[bold]#{E:@pane_status_index}#[nobold] #{E:@pane_status_agent}#{=/19/…:#{E:@title_pane}} #[default] '
set -g @pane_status_current \
  '#[#{E:pane-status-current-style}] > #{E:@pane_status_agent}#{=/19/…:#{E:@title_pane}} #[default] #[align=right] pwd=#{E:@pane_status_path} #{E:@pane_status_branch} '
set -g status-format[1] \
  '#{P:#{E:@pane_status},#{E:@pane_status_current}}'

# messages
set -g display-time 5000
set -g message-style 'fg=black bg=orange bold'

# Reuse published pane metadata so tabs update without polling or extra hooks.
set -g @taw_pane_agent_icon '#{?#{m/r:^(codex|claude)$,#{@taw_agent}},#{?#{==:#{@taw_agent_state},waiting},󰹇,#{?#{==:#{@taw_agent_state},acknowledged},…,#{?#{==:#{@taw_agent_state},thinking},󰔟,#{?#{==:#{@taw_agent_state},idle},󰚩,}}}},}'
set -g @taw_window_agent_icon '#{?#{m/r:(codex|claude)=waiting;,#{P:#{@taw_agent}=#{@taw_agent_state};}},󰹇,#{?#{m/r:(codex|claude)=acknowledged;,#{P:#{@taw_agent}=#{@taw_agent_state};}},…,#{?#{m/r:(codex|claude)=thinking;,#{P:#{@taw_agent}=#{@taw_agent_state};}},󰔟,#{?#{m/r:(codex|claude)=idle;,#{P:#{@taw_agent}=#{@taw_agent_state};}},󰚩,}}}}'

# test key
bind -n C-, display-message 'Test Key Received'
