# Change the prefix key
unbind C-b
set-option -g prefix C-\\

# Preserve modified keys for terminal TUIs such as Codex.
set-option -s extended-keys always
set-option -s extended-keys-format csi-u
set-option -as terminal-features ',xterm-ghostty:extkeys'

# Let programs send DCS escape sequences through tmux to the underlying
# terminal. Required for the Kitty graphics protocol (used by Snacks.image
# in nvim) to render images, mermaid diagrams, and LaTeX math.
set -g allow-passthrough on

# Index from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Keep more history in the scrollback buffer
set -g history-limit 10000

# Don't detach until the last session is killed
set -g detach-on-destroy no-detached

# Don't kill panes if they error
set -g remain-on-exit off  # on|off|failed

# Key Bindings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind C-\\ command-prompt
bind -n C-Enter choose-tree -sZ -O time

# sessionizer
bind-key -n C-f run-shell "tmux neww ~/.zfuns/taw -ts"

# Fast-switch sessions
bind -n C-up switch-client -p
bind -n C-down switch-client -n
bind -n C-S-` switch-client -l # toggle sessions

bind -n C-M-n {
  command-prompt -bF -p 'name:,start-dir:' -I ',~' -T 'target' \
  "new -A -s %1 -c %2 -f no-detach-on-destroy"
}

# Fast-switch windows
bind -n C-left prev
bind -n C-right next
bind -n C-M-h prev
bind -n C-M-o next
bind -n C-` last # toggle

bind -n C-M-j select-window -t 1
bind -n C-M-k select-window -t 2
bind -n C-M-l select-window -t 3
bind -n C-M-: select-window -t 4

# Move windows
bind -n C-M-left swap-window -d -t -
bind -n C-M-right swap-window -d -t +
bind S swap-window -d -t !

bind -n C-q kill-window

# fast-switch panes
bind -n C-h selectp -Zt -

bind -n C-j selectp -Zt 1
bind -n C-k selectp -Zt 2
bind -n C-l selectp -Zt 3
bind -n C-: selectp -Zt 4

# fast-kill pane
unbind-key x
bind-key x kill-pane

# split panes nicer
unbind-key '"'
bind-key '"' split-window -c "#{pane_current_path}"
bind-key "'" split-window -h -c "#{pane_current_path}"

# Agents
bind-key C-x split-window -h codex
bind-key C-c split-window -h claude
bind-key C-g split-window -h gemini

# Agent alerts
bind-key A {
  setw monitor-bell on ;
  setw monitor-silence 20 ;
  display-message "agent alerts on for this window"
}
bind-key a {
  setw monitor-bell off ;
  setw monitor-silence 0 ;
  display-message "agent alerts off for this window"
}

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# When alerts happen, only alert for non-current windows.
set -g activity-action other
set -g silence-action other
set -g bell-action other

# "both" = tmux message + terminal bell.
# Use "on" if you only want tmux status messages.
# Use "off" if you want the raw bell passed to the terminal without tmux message.
set -g visual-activity both
set -g visual-silence both
set -g visual-bell both

# Make alerting windows visually obvious in the status line.
setw -g window-status-activity-style reverse
setw -g window-status-bell-style reverse

# clock mode
setw -g clock-mode-colour orange

# copy mode
setw -g mode-style 'fg=black bg=orange bold'

# panes
# set -g pane-border-style 'fg=cyan'
set -g pane-active-border-style 'fg=orange'

# set terminal emulator title
set-option -g set-titles on
set-option -g set-titles-string "#S[#W] (-c #(~/.config/tmux/wspath '#{session_path}'))"

# statusbar
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style 'fg=orange'

set -g allow-rename on

set -g status-left-length 50
set -g status-left '-s #{?client_prefix,#{=/34/…:session_name} #[fg=black bg=orange bold] (#{prefix})->... ,#S }'

setw -g window-status-style 'fg=orange bg=black'
setw -g window-status-format ' #[bold]#{?#{<:#I,5},#(~/.config/tmux/ikey '#I'),#I} #[nobold]#[fg=white]#W #[fg=yellow bold]#{?#F,#F, } '

setw -g window-status-current-style 'fg=black bg=orange'
setw -g window-status-current-format " ^ #W #F "

set -g status-right-length 50
set -g status-right " pwd=#(~/.config/tmux/wspath '#{pane_current_path}') "

setw -g window-status-bell-style 'fg=black bg=orange bold'

# messages
set -g message-style 'fg=black bg=orange bold'

# test key
bind -n C-, display-message 'Test Key Received'

